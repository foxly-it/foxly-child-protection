# Hält die per SHA gepinnten Actions aktuell: ein gebündelter PR pro Monat,
# die Validierung läuft automatisch mit. Die Go-Module in tools/engine-check
# folgen bewusst nicht Dependabot, sondern der urlfilter-Version des jeweils
# aktuellen AdGuard-Home-Releases (siehe README, Abschnitt Tests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
