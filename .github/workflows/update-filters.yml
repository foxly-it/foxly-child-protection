# Tägliche Aktualisierung: erzeugen und prüfen (validate.yml) -> GitHub Pages
# -> Liste im Repository ablegen. Schlägt ein Schritt fehl, bleibt die zuletzt
# veröffentlichte Liste unverändert online.
name: Filterliste aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Europe/Berlin"   # 04:00 deutscher Zeit, Sommer- und Winterzeit
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Deutlich kleinere Liste trotzdem veröffentlichen (z. B. nach Entfernen einer Quelle)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/**
      - site/**
      - tools/**
      - .github/workflows/**

permissions: {}

concurrency:
  group: update-filters
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      allow_shrink: ${{ inputs.allow_shrink == true }}

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  archive:
    name: Liste im Repository ablegen
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # Commit nur bei geänderten Regeln oder nach 45 Tagen ohne Commit: GitHub
      # deaktiviert Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Aktivität.
      - name: Commit bei Änderung oder als Keepalive
        run: |
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/pages" ./filterlist-child.txt
          new="$RUNNER_TEMP/pages/filterlist-child.txt" old=filters/filterlist-child.txt
          rules=$(grep -m1 '^! Rules:' "$new" | cut -d' ' -f3)
          if [ -f "$old" ] && diff -q <(grep -v '^! Last modified:' "$old") <(grep -v '^! Last modified:' "$new") >/dev/null; then
            age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$age" -lt 45 ]; then
              echo "Regeln unverändert ($rules), letzter Commit vor $age Tagen – kein Commit nötig."
              exit 0
            fi
            msg="Keepalive: Filterliste unverändert ($rules Regeln), letzter Commit vor $age Tagen"
          else
            msg="Filterliste aktualisiert: $rules Regeln"
          fi
          mkdir -p filters && cp "$new" "$old"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$old"
          git commit -m "$msg"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "$msg"
